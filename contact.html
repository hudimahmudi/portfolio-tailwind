<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="portofolio.css">
</head>

<body>
  <header>
    <div class="nav-container">

      <h2 class="logo">H&M</h2>

      <button id="hamburger">☰</button>

      <nav id="nav-menu">
        <a href="home.html">Home</a>
        <a href="article.html">Article</a>
        <a href="contact.html">Contact</a>
        <a href="aboutme.html">About Me</a>
      </nav>

    </div>
  </header>
  <section id="contact" class="normal-section">
    <div class="container">
      <h2>CONTACT ME</h2>
      <p>Tertarik dengan porto saya? Silahkan hubungi saya</p>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Nama</label>
          <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">Pesan</label>
          <textarea id="message" name="message" rows="6" placeholder="Tulis pesan Anda..." required></textarea>
        </div>
        <button type="submit">Kirim Pesan</button>
        <p id="statusMessage"></p>
      </form>
    </div>
  </section>
</body>
<footer>
  <p> &copy; Portofolio Hudi Mahmudi</p>
</footer>
<script>
  const hamburger = document.getElementById("hamburger");
  const nav = document.getElementById("nav-menu");

  hamburger.addEventListener("click", function () {
    nav.classList.toggle("active");
  });
</script>

</html>
